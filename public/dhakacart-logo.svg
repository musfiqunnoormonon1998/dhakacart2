<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Clean anti-aliased styling -->
    <style>
      .logo-bg { fill: #FAF8F5; }
      .brand-circle { fill: none; stroke: #124E33; stroke-width: 4.5; }
      .cart-line { fill: none; stroke: #124E33; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .cart-detail { fill: none; stroke: #124E33; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .monument { fill: none; stroke: #124E33; stroke-width: 3.5; stroke-linejoin: round; }
      .rickshaw-line { fill: none; stroke: #124E33; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .brand-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 700; fill: #124E33; letter-spacing: -0.5px; text-anchor: middle; }
      .brand-sub { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #1C2520; letter-spacing: 2.8px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Circular Outer Frame -->
  <circle cx="250" cy="250" r="236" class="logo-bg" />
  <circle cx="250" cy="230" r="195" class="brand-circle" />

  <!-- SHOPPING CART / D-C MONOGRAM -->
  <g id="cart-monogram" transform="translate(10, -5)">
    <!-- Cart Handle & Top Bar -->
    <path d="M 172 135 L 186 135 L 202 235 L 246 235" class="cart-line" />
    
    <!-- Letter D Top & Spine -->
    <path d="M 196 150 L 252 150 C 280 150 286 172 268 190" class="cart-line" />
    
    <!-- Cart Bottom Plate / Letter D Base -->
    <path d="M 203 252 L 278 252 C 288 252 292 245 292 238 C 292 230 284 228 274 228 L 207 228 C 196 228 192 236 192 244 C 192 251 199 252 208 252 L 284 252" class="cart-line" />
    
    <!-- Letter C Curve (Front of Cart) -->
    <path d="M 326 182 C 344 192 344 235 324 246 C 304 255 288 248 288 240" class="cart-line" />
    <path d="M 302 152 C 342 152 358 184 358 214 C 358 246 338 272 294 272" class="cart-line" />

    <!-- Jatiyo Sriti Soudho (National Martyrs' Memorial) inside basket -->
    <!-- Stepped triangular steles silhouette -->
    <g id="sriti-soudho" transform="translate(226, 155)">
      <!-- Central apex -->
      <line x1="0" y1="0" x2="0" y2="78" class="monument" stroke-width="4" />
      <!-- Left pair 1 -->
      <path d="M 0 0 L -8 78" class="monument" stroke-width="3" />
      <path d="M 0 16 L -16 78" class="monument" stroke-width="2.5" />
      <path d="M 0 32 L -25 78" class="monument" stroke-width="2.5" />
      <path d="M 0 48 L -35 78" class="monument" stroke-width="2" />
      <!-- Right pair 1 -->
      <path d="M 0 0 L 8 78" class="monument" stroke-width="3" />
      <path d="M 0 16 L 16 78" class="monument" stroke-width="2.5" />
      <path d="M 0 32 L 24 78" class="monument" stroke-width="2.5" />
      <!-- Ground line of monument -->
      <line x1="-38" y1="78" x2="25" y2="78" class="monument" stroke-width="2.5" />
    </g>

    <!-- Dhaka Skyline Buildings behind monument -->
    <g id="skyline" transform="translate(202, 178)">
      <!-- Building 1 -->
      <rect x="0" y="24" width="9" height="32" class="cart-detail" />
      <line x1="4.5" y1="18" x2="4.5" y2="24" class="cart-detail" />
      <!-- Building 2 -->
      <rect x="11" y="14" width="10" height="42" class="cart-detail" />
      <!-- Building 3 on right of monument -->
      <rect x="48" y="20" width="8" height="36" class="cart-detail" />
      <rect x="58" y="28" width="7" height="28" class="cart-detail" />
    </g>

    <!-- Dhaka Cycle Rickshaw inside C curve -->
    <g id="rickshaw" transform="translate(305, 204)">
      <!-- Canopy Hood (Triangular / curved hood) -->
      <path d="M -2 14 C -6 6 4 -1 12 0 C 18 1 20 6 22 14" class="rickshaw-line" />
      <!-- Rickshaw Seat & passenger body -->
      <path d="M 1 14 L 18 14" class="rickshaw-line" stroke-width="3" />
      <!-- Rickshaw Back Wheels -->
      <circle cx="5" cy="28" r="7" class="rickshaw-line" />
      <!-- Frame to Pedals & Front Wheel -->
      <path d="M 14 18 L 22 24 L 28 20" class="rickshaw-line" />
      <!-- Rickshaw Front Wheel & Handle -->
      <circle cx="28" cy="27" r="5" class="rickshaw-line" />
      <path d="M 28 22 L 26 12 L 23 11" class="rickshaw-line" />
    </g>

    <!-- Cart Bottom Wheels -->
    <circle cx="218" cy="272" r="8" class="cart-line" />
    <circle cx="276" cy="272" r="8" class="cart-line" />
  </g>

  <!-- Typography -->
  <text x="250" y="362" class="brand-title">DhakaCart</text>
  <text x="250" y="386" class="brand-sub">CLASSY ONLINE SHOPPING | DHAKA</text>
</svg>
